<!doctype html>
<meta charset="utf-8">
<title>Soundscape card harness</title>
<style>
  body { margin: 0; padding: 20px; font-family: Roboto, "Segoe UI", sans-serif; background: var(--bg); }
  body.light { --bg: #fafafa; --card-background-color: #fff; --primary-text-color: #212121; --secondary-text-color: #727272;
    --divider-color: rgba(0,0,0,.12); --primary-color: #03a9f4; --secondary-background-color: #e5e5e5; }
  body.dark { --bg: #111; --card-background-color: #1c1c1c; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225,225,225,.12); --primary-color: #03a9f4; --secondary-background-color: #282828; }
  soundscape-card { display: block; width: 480px; }
</style>
<body class="light">
<script type="module">
  import * as mdi from './node_modules/@mdi/js/mdi.js';
  customElements.define('ha-card', class extends HTMLElement {
    connectedCallback() { this.style.cssText = 'display:block;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px'; }
    set header(text) {   // Home Assistant's stock card header
      this.querySelector('h1.card-header')?.remove();
      if (!text) return;
      const h = document.createElement('h1');
      h.className = 'card-header'; h.textContent = text;
      h.style.cssText = 'margin:0;padding:12px 16px 16px;font:400 24px/48px Roboto,sans-serif;letter-spacing:-0.012em;color:var(--primary-text-color)';
      this.prepend(h);
    }
  });
  customElements.define('ha-icon', class extends HTMLElement {
    static observedAttributes = ['icon'];
    attributeChangedCallback() { this.draw(); }
    connectedCallback() { this.draw(); }
    draw() {
      const key = 'mdi' + (this.getAttribute('icon') || '').replace('mdi:', '').split('-').map((p) => p[0].toUpperCase() + p.slice(1)).join('');
      const size = getComputedStyle(this).getPropertyValue('--mdc-icon-size') || '24px';
      this.style.display = 'inline-flex';
      this.innerHTML = `<svg viewBox="0 0 24 24" style="width:${size};height:${size};fill:currentColor"><path d="${mdi[key] || ''}"/></svg>`;
      if (!mdi[key]) console.error('no icon', key);
    }
  });
  const q = new URLSearchParams(location.search);
  document.body.className = q.get('theme') || 'light';
  const init = await (await fetch('./fixture.json')).json();
  await import('../custom_components/soundscape/www/soundscape-card.js');
  const card = document.createElement('soundscape-card');
  card.setConfig({ title: 'Soundscape', ...JSON.parse(q.get('config') || '{}') });
  document.body.append(card);
  window.card = card; window.calls = [];
  card.hass = { user: { is_admin: true }, callWS: async (msg) => {
    window.calls.push(JSON.stringify(msg));
    if (msg.type === 'soundscape/clip') {   // 20 s: hiss, a hum, bird chirps high up, and a siren from 6 to 16 s
      const rate = 24000, n = rate * 20, pcm = new Int16Array(n);
      let ph = 0, seed = 7;
      for (let i = 0; i < n; i++) {
        const t = i / rate;
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        let v = (seed / 0x7fffffff - 0.5) * 0.02 + 0.01 * Math.sin(2 * Math.PI * 120 * t);
        if (t > 6 && t < 16) { const tri = Math.abs(((t - 6) / 4.5 % 1) * 2 - 1); ph += 2 * Math.PI * (650 + 800 * tri) / rate; v += 0.25 * Math.sin(ph) + 0.08 * Math.sin(2 * ph); }
        if (t % 1.7 < 0.25) v += 0.12 * Math.sin(2 * Math.PI * (4200 + 3000 * (t % 1.7)) * t);
        pcm[i] = Math.max(-1, Math.min(1, v)) * 32767;
      }
      const bytes = new Uint8Array(pcm.buffer); let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const ev = [...init.active, ...init.recent].find((e) => e.id === msg.event);
      return { rate, t0: ev.start - 8, mic: 'Front', data: btoa(bin) };
    }
    if (msg.type === 'soundscape/transcribe') {
      await new Promise((r) => setTimeout(r, 300));
      if (q.get('stt') === '0') { const e = new Error('No speech-to-text engine is set up in Home Assistant'); e.code = 'no_engine'; throw e; }
      return { text: 'Is this the right house? I think the package goes around the side.', engine: 'faster-whisper' };
    }
    if (msg.type === 'map_tiles/access_token') { if (q.get('proxy') === '0') throw new Error('unknown command'); return { token: 'tok123' }; }
    return null;
  }, connection: { subscribeMessage: async (cb, msg) => {
    window.calls.push(msg.type + (msg.mic ? ':' + msg.mic : ''));
    if (msg.type === 'soundscape/listen') { window.pcm = cb; return () => window.calls.push('stop:' + msg.mic); }
    cb(init); window.feed = cb; return () => {};
  } } };
  init.recent.forEach((e) => { e.clip = true; });
  if (q.get('recent')) { card._open = String(init.recent.find((e) => e.cls === q.get('recent'))?.id); card._render(); }
  if (q.get('open')) { card._open = String(init.active.find((e) => e.cls === q.get('open'))?.id); card._render(); }
  window.ready = true;
</script>
