name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, so a new Home Assistant release that breaks this shows up

jobs:
  hassfest:
    name: Home Assistant manifest and translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Tests, including a run inside Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy pytest-homeassistant-custom-component ha-ffmpeg home-assistant-frontend
      - run: python -m pytest tests
